name: Feature request
description: Propose a new capability, mission, skill or platform
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Hiptop do? How would you know it works (the test or evidence that proves it)?
    validations:
      required: true
